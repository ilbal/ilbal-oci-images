# Extension catalog for ilbal-oci-images
#
# The development image includes ALL extensions listed here.
# This file lets you record which extensions your project needs
# for a custom production image build.
#
# To exclude an extension from a production build, comment out its
# line or sub-table.  Commented-out lines remain available in the
# dev image but are omitted from the production build.
#
# Optional per-extension keys (sub-tables only):
#   runtime_deps  — Nix packages needed at runtime (e.g., shared libs).
#   dependencies  — Extra Nix packages to pass as build inputs to
#                   custom extension derivations (see ogr_fdw for example).
#   override      — Attribute overrides for the nixpkgs derivation.

# --- Extensions -------------------------------------------------
# Simple nixpkgs extensions — one line each.
# Uncomment to include, comment out to exclude.

[extensions]
nixpkgs = [
  "pgrouting",
  "pointcloud",
  "pg_duckdb",
  "pg_cron",
  "pgjwt",
  "pgsodium",
  "pg_csv",
  "pg_tle",
  "pgsql-http",
  "pg_net",
  "pgtap",
  "pg_safeupdate",
  "tds_fdw",
  # To exclude a simple extension, comment out its line:
  # "pg_anonymizer",
]

# Extensions with extra configuration — sub-table per extension.
# Uncomment the entire block to include.

[extensions.postgis]
runtime_deps = [ "sfcgal" ]
override.withSfcgal = true

[extensions.ogr_fdw]
# Map derivation parameter → Nix package name.
# Switch to { gdal = "gdal" } for the full GDAL (~1.1 GiB closure).
dependencies = { gdal = "gdalMinimal" }

[extensions.pg_accumulator]

[extensions.pg_currency]

# To exclude an extension with extra config, comment out the entire
# sub-table block (the header and all its keys):
# [extensions.pg_partman]
# runtime_deps = [ ]

# --- Runtime base packages ---------------------------------
# Always present in the image regardless of extension selection.

[runtime_base]
packages = [
  "bash",
  "busybox",
  "coreutils",
  "findutils",
  "gzip",
  "less",
  "ncurses",
  "pspg",
  "su-exec",
  "xz.bin",
  "zstd.bin",
]
